<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Mechana Brand Preview</title>
<style>
body{font-family:system-ui;margin:0;background:#0D1117;color:white}
main{max-width:1100px;margin:auto;padding:40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{background:#151b23;border:1px solid #2a3440;border-radius:14px;padding:24px}
.light{background:white}
img{width:100%;height:auto;display:block}
</style>
<main><h1>Mechana Brand Assets</h1><div class="grid">
<div class="card"><img src="brand/mechana-lockup-horizontal-transparent-dark.svg"></div>
<div class="card light"><img src="brand/mechana-lockup-horizontal-transparent-light.svg"></div>
<div class="card"><img src="brand/mechana-mark-color-dark.svg"></div>
<div class="card light"><img src="brand/mechana-mark-color-light.svg"></div>
</div></main>
